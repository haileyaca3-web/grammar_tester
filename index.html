<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Master</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f5fb;--white:#fff;--dark:#1a3a5c;--mid:#3a5a7a;--muted:#8a9ab0;--border:#c8dff5;--border2:#e0ecf8;--blue:#2c6fb5;--blue2:#4a90d9;--blue-bg:#eef6ff;--blue-light:#f0f7ff;--green:#27ae60;--green-bg:#eafaf1;--red:#e74c3c;--red-bg:#fdf0ee;--gold:#f5a623;--gold-bg:#fff8ed;--purple:#7c3aed;--purple-bg:#f3f0ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito','Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--dark);}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
.top-bar{background:var(--white);border-bottom:2px solid var(--border2);padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.back-btn{width:38px;height:38px;border-radius:11px;border:2px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
.top-title{font-size:17px;font-weight:700;}
.top-sub{font-size:12px;color:var(--muted);}
.badge{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-left:auto;}
.content{flex:1;padding:16px;max-width:700px;width:100%;margin:0 auto;}
.btn{display:flex;align-items:center;justify-content:center;padding:15px 24px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;width:100%;}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;}
.spacer{height:16px;}
.prog-bar{height:5px;background:var(--border2);}
.prog-fill{height:100%;transition:width .4s;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

#screen-login{background:linear-gradient(160deg,#1a3a5c,#0f2a4a);align-items:center;justify-content:center;padding:40px 24px;}
.login-wrap{width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo h1{color:#fff;font-size:30px;font-weight:900;}
.login-logo p{color:rgba(255,255,255,.4);font-size:14px;margin-top:6px;}
.login-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px 24px;}
.field{margin-bottom:16px;}
.field label{display:block;color:rgba(255,255,255,.55);font-size:14px;font-weight:700;margin-bottom:8px;}
.field input{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;}
.login-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:6px;}
#login-error{color:#ff8a80;font-size:13px;font-weight:700;text-align:center;margin-bottom:10px;display:none;}

#screen-main{background:var(--bg);}
.main-hero{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:28px 20px 24px;}
.main-hero .hi{font-size:15px;color:rgba(255,255,255,.55);margin-bottom:5px;}
.main-hero h1{font-size:26px;font-weight:900;color:#fff;}
.sec-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.5px;margin:20px 0 10px;}
.ch-card{background:var(--white);border:2px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:14px;}
.ch-head{display:flex;align-items:center;padding:16px 18px;gap:12px;}
.ch-num{width:44px;height:44px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;}
.ch-info h3{font-size:18px;font-weight:900;color:var(--dark);}
.ch-info p{font-size:13px;color:var(--muted);margin-top:2px;}
.unit-list{border-top:1.5px solid var(--border2);}
.unit-row{display:flex;align-items:center;padding:14px 18px;gap:12px;border-bottom:1.5px solid var(--border2);}
.unit-row:last-child{border-bottom:none;}
.udot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.uinfo{flex:1;}
.uinfo .unum{font-size:14px;font-weight:800;color:var(--dark);}
.uinfo .uname{font-size:13px;color:var(--mid);margin-top:2px;}
.unit-btns{display:flex;gap:5px;}
.unit-btn{padding:8px 11px;border-radius:9px;border:2px solid var(--border);background:var(--blue-light);font-size:13px;font-weight:800;color:var(--blue);cursor:pointer;font-family:inherit;}

.pt-card{background:var(--white);border:2px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px;}
.pt-head{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1.5px solid var(--border2);}
.pt-tag{padding:4px 11px;border-radius:8px;font-size:12px;font-weight:800;}
.pt-body{padding:16px 18px;}
.formula{background:var(--dark);color:#fff;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;margin-bottom:13px;text-align:center;}
.key-rule{background:var(--blue-light);border-left:4px solid var(--blue);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.7;}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.adv-item{background:var(--blue-light);border-radius:9px;padding:10px 12px;}
.adv-en{font-weight:800;color:var(--blue);font-size:14px;}
.adv-kr{font-size:12px;color:var(--muted);margin-top:2px;}
.ex-item{padding:10px 0;border-bottom:1.5px solid var(--border2);}
.ex-item:last-child{border-bottom:none;}
.ex-en{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:3px;}
.ex-kr{font-size:13px;color:var(--muted);}
.caution{background:var(--gold-bg);border:1.5px solid #fde8b5;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5a00;line-height:1.7;margin-top:10px;}

.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.q-count{font-size:15px;font-weight:700;color:var(--muted);}
.q-timer{font-size:15px;font-weight:800;color:var(--red);background:var(--red-bg);padding:6px 14px;border-radius:20px;border:2px solid #f5b7b1;}
.blank-card{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px;}
.blank-num{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px;}
.blank-hint{font-size:14px;color:var(--mid);background:var(--blue-light);border-radius:9px;padding:10px 13px;margin-bottom:13px;}
.blank-sent{font-size:17px;font-weight:700;line-height:2.4;margin-bottom:8px;color:var(--dark);}
.blank-input{border:none;border-bottom:3px solid var(--blue);min-width:120px;padding:2px 8px;font-size:16px;font-family:inherit;color:var(--blue);background:transparent;text-align:center;outline:none;}
.blank-input.ok{border-color:var(--green);color:var(--green);}
.blank-input.ng{border-color:var(--red);color:var(--red);}
.blank-tr{font-size:13px;color:var(--muted);font-style:italic;margin-top:5px;}
.check-btn{width:100%;padding:13px;background:var(--dark);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:10px;}
.fb{padding:12px 14px;border-radius:11px;font-size:14px;margin-top:9px;display:none;line-height:1.6;font-weight:700;}
.fb.ok{background:var(--green-bg);color:#155724;border:2px solid #a8e6c0;}
.fb.ng{background:var(--red-bg);color:#7b1919;border:2px solid #f5b7b1;}

.q-card{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px;}
.q-badge{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:800;background:var(--blue-bg);color:var(--blue);margin-bottom:12px;}
.q-text{font-size:15px;font-weight:700;color:var(--dark);line-height:1.7;margin-bottom:14px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{padding:13px 16px;border-radius:11px;border:2px solid var(--border2);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--white);color:var(--dark);}
.opt.right{border-color:var(--green);background:var(--green-bg);color:#155724;}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:#7b1919;}
.opt-n{width:26px;height:26px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;color:var(--blue);}

.diff-tabs{display:flex;gap:8px;margin-bottom:14px;}
.diff-tab{flex:1;padding:11px 6px;border-radius:13px;border:2px solid var(--border2);background:var(--white);text-align:center;cursor:pointer;}
.diff-tab .di{font-size:18px;margin-bottom:3px;}
.diff-tab .dl{font-size:13px;font-weight:800;color:var(--muted);}
.diff-tab.e-on{background:var(--green-bg);border-color:var(--green);}
.diff-tab.e-on .dl{color:var(--green);}
.diff-tab.m-on{background:var(--gold-bg);border-color:var(--gold);}
.diff-tab.m-on .dl{color:var(--gold);}
.diff-tab.h-on{background:var(--red-bg);border-color:var(--red);}
.diff-tab.h-on .dl{color:var(--red);}
.q-info-bar{background:var(--blue-light);border:2px solid var(--border);border-radius:11px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--mid);margin-bottom:13px;}

.tc-class-btn,.tr-cls-btn{padding:9px 16px;border-radius:20px;border:2px solid #c8dff5;background:#fff;color:#5a7a9a;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.tc-class-btn.tc-on,.tr-cls-btn.on{background:#2c6fb5;border-color:#2c6fb5;color:#fff;}
.tc-book-btn{padding:13px 16px;border-radius:13px;border:2px solid #c8dff5;background:#fff;color:#5a7a9a;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;}
.tc-book-btn.tc-book-on{background:#eef6ff;border-color:#2c6fb5;color:#2c6fb5;}
</style>
</head>
<body>

<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo"><h1>Grammar Master</h1><p>영어 문법 학습 앱</p></div>
    <div class="login-card">
      <div class="field"><label>아이디</label><input id="inp-id" type="text"></div>
      <div class="field"><label>비밀번호</label><input id="inp-pw" type="password"></div>
      <div id="login-error">아이디 또는 비밀번호가 틀렸습니다.</div>
      <button class="login-btn" onclick="doLogin()">로그인</button>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;padding:0 4px;">
      <div style="color:rgba(255,255,255,.3);font-size:14px;cursor:pointer;text-decoration:underline;" onclick="goTo('signup')">회원가입</div>
      <div style="color:rgba(255,255,255,.3);font-size:14px;cursor:pointer;text-decoration:underline;" onclick="goTo('teacher-login')">선생님</div>
    </div>
  </div>
</div>

<div id="screen-signup" class="screen" style="background:linear-gradient(160deg,#1a3a5c,#0f2a4a);align-items:center;justify-content:center;padding:40px 24px;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:28px;"><div style="font-size:28px;font-weight:900;color:#fff;">회원가입</div></div>
    <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px 24px;">
      <div style="margin-bottom:16px;"><label style="display:block;font-size:14px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:8px;">이름</label><input id="su-name" type="text" style="width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;"></div>
      <div style="margin-bottom:16px;"><label style="display:block;font-size:14px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:8px;">반</label>
        <select id="su-class" style="width:100%;background:rgba(30,60,100,.8);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;">
          <option value="">반 선택</option><option value="5a">5a</option><option value="6a">6a</option><option value="1a">1a</option><option value="1b">1b</option><option value="2a">2a</option><option value="2b">2b</option><option value="2c">2c</option><option value="3a">3a</option><option value="3b">3b</option><option value="3c">3c</option>
        </select>
      </div>
      <div style="margin-bottom:16px;"><label style="display:block;font-size:14px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:8px;">아이디</label><input id="su-id" type="text" style="width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;"></div>
      <div style="margin-bottom:20px;"><label style="display:block;font-size:14px;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:8px;">비밀번호</label><input id="su-pw" type="password" style="width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;"></div>
      <div id="su-error" style="color:#ff8a80;font-size:13px;font-weight:700;text-align:center;margin-bottom:10px;display:none;"></div>
      <button onclick="doSignup()" style="width:100%;padding:16px;background:linear-gradient(135deg,#2c6fb5,#4a90d9);border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;">가입하기</button>
    </div>
    <div style="text-align:center;margin-top:16px;color:rgba(255,255,255,.3);font-size:14px;cursor:pointer;text-decoration:underline;" onclick="goTo('login')">← 로그인으로</div>
  </div>
</div>

<div id="screen-teacher-login" class="screen" style="background:linear-gradient(160deg,#1a3a5c,#0f2a4a);align-items:center;justify-content:center;padding:40px 24px;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:28px;"><div style="font-size:26px;font-weight:900;color:#fff;">선생님 로그인</div></div>
    <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px 24px;">
      <div style="margin-bottom:16px;"><label style="display:block;color:rgba(255,255,255,.55);font-size:14px;font-weight:700;margin-bottom:8px;">아이디</label><input id="t-id" type="text" style="width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;"></div>
      <div style="margin-bottom:20px;"><label style="display:block;color:rgba(255,255,255,.55);font-size:14px;font-weight:700;margin-bottom:8px;">비밀번호</label><input id="t-pw" type="password" style="width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:13px;padding:15px 17px;color:#fff;font-size:16px;font-family:inherit;outline:none;"></div>
      <div id="t-error" style="color:#ff8a80;font-size:13px;font-weight:700;text-align:center;margin-bottom:10px;display:none;">틀렸습니다</div>
      <button onclick="doTeacherLogin()" style="width:100%;padding:16px;background:linear-gradient(135deg,#2c6fb5,#4a90d9);border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;">로그인</button>
    </div>
    <div style="text-align:center;margin-top:16px;color:rgba(255,255,255,.3);font-size:14px;cursor:pointer;text-decoration:underline;" onclick="goTo('login')">← 학생으로</div>
  </div>
</div>

<div id="screen-teacher-main" class="screen">
  <div style="background:linear-gradient(135deg,#1a3a5c,#2c6fb5);padding:28px 20px 24px;"><div style="font-size:15px;color:rgba(255,255,255,.5);margin-bottom:5px;">선생님 모드</div><div style="font-size:24px;font-weight:900;color:#fff;">관리 페이지</div></div>
  <div style="padding:16px;max-width:700px;margin:0 auto;">
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="background:#fff;border:2px solid #c8dff5;border-radius:18px;padding:20px;cursor:pointer;" onclick="goTo('teacher-students')"><div style="font-size:18px;font-weight:900;color:#1a3a5c;margin-bottom:4px;">학생 관리</div><div style="font-size:14px;color:#8a9ab0;">계정 추가/수정</div></div>
      <div style="background:#fff;border:2px solid #c8dff5;border-radius:18px;padding:20px;cursor:pointer;" onclick="enterTeacherChapters()"><div style="font-size:18px;font-weight:900;color:#1a3a5c;margin-bottom:4px;">Chapter 개방 관리</div><div style="font-size:14px;color:#8a9ab0;">반별 Chapter 열기/닫기</div></div>
      <div style="background:#fff;border:2px solid #c8dff5;border-radius:18px;padding:20px;cursor:pointer;" onclick="goTo('teacher-results')"><div style="font-size:18px;font-weight:900;color:#1a3a5c;margin-bottom:4px;">학생 결과 확인</div><div style="font-size:14px;color:#8a9ab0;">점수/오답 확인</div></div>
    </div>
    <button onclick="goTo('login')" style="width:100%;padding:14px;background:transparent;border:2px solid #c8dff5;border-radius:14px;color:#8a9ab0;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:20px;">로그아웃</button>
  </div>
</div>

<div id="screen-teacher-students" class="screen">
  <div class="top-bar"><button class="back-btn" onclick="goTo('teacher-main')">‹</button><div><div class="top-title">학생 관리</div></div></div>
  <div class="content">
    <div style="background:#fff;border:2px solid #c8dff5;border-radius:18px;padding:20px;margin-bottom:14px;">
      <div style="font-size:16px;font-weight:800;color:#1a3a5c;margin-bottom:14px;">새 학생 추가</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
        <input id="s-class" type="text" placeholder="반" style="padding:13px 15px;border:2px solid #c8dff5;border-radius:12px;font-size:15px;font-family:inherit;outline:none;">
        <input id="s-id" type="text" placeholder="아이디" style="padding:13px 15px;border:2px solid #c8dff5;border-radius:12px;font-size:15px;font-family:inherit;outline:none;">
        <input id="s-pw" type="text" placeholder="비밀번호" style="padding:13px 15px;border:2px solid #c8dff5;border-radius:12px;font-size:15px;font-family:inherit;outline:none;">
        <input id="s-name" type="text" placeholder="이름" style="padding:13px 15px;border:2px solid #c8dff5;border-radius:12px;font-size:15px;font-family:inherit;outline:none;">
      </div>
      <button onclick="addStudent()" class="btn btn-blue">추가</button>
    </div>
  </div>
</div>

<div id="screen-teacher-chapters" class="screen">
  <div class="top-bar"><button class="back-btn" onclick="goTo('teacher-main')">‹</button><div><div class="top-title">Chapter 개방</div></div></div>
  <div class="content">
    <div style="font-size:12px;font-weight:700;color:#8a9ab0;margin-bottom:10px;">반 선택</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
      <button onclick="tcSelectClass('5a',this)" class="tc-class-btn tc-on">5a</button><button onclick="tcSelectClass('6a',this)" class="tc-class-btn">6a</button>
      <button onclick="tcSelectClass('1a',this)" class="tc-class-btn">1a</button><button onclick="tcSelectClass('1b',this)" class="tc-class-btn">1b</button>
      <button onclick="tcSelectClass('2a',this)" class="tc-class-btn">2a</button><button onclick="tcSelectClass('2b',this)" class="tc-class-btn">2b</button>
      <button onclick="tcSelectClass('2c',this)" class="tc-class-btn">2c</button><button onclick="tcSelectClass('3a',this)" class="tc-class-btn">3a</button>
      <button onclick="tcSelectClass('3b',this)" class="tc-class-btn">3b</button><button onclick="tcSelectClass('3c',this)" class="tc-class-btn">3c</button>
    </div>
    <div style="font-size:12px;font-weight:700;color:#8a9ab0;margin-bottom:10px;">교재</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">

<script>
const API_URL='https://script.google.com/macros/s/AKfycby6-sl59WdanXr-DbLtIfx0RK074w5UqRmuj27wYdrmKaKdIwcv97KXjHnYDwF2hs-J/exec';

function goTo(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0);}

function callAPI(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const url=API_URL+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')+'&callback='+cb;
    const script=document.createElement('script');
    const timer=setTimeout(()=>{delete window[cb];if(script.parentNode)document.body.removeChild(script);reject(new Error('timeout'));},30000);
    window[cb]=(data)=>{clearTimeout(timer);delete window[cb];if(script.parentNode)document.body.removeChild(script);resolve(data);};
    script.src=url;
    script.onerror=()=>{clearTimeout(timer);delete window[cb];reject(new Error('error'));};
    document.body.appendChild(script);
  });
}

function makeLoader(color,title){
  return '<div style="text-align:center;padding:60px 20px;"><div style="width:50px;height:50px;border:5px solid #e0ecf8;border-top-color:'+color+';border-radius:50%;margin:0 auto 20px;animation:spin 0.8s linear infinite;"></div><div style="font-size:17px;font-weight:800;color:#1a3a5c;margin-bottom:8px;">'+title+'</div><div style="font-size:13px;color:#8a9ab0;line-height:1.6;">AI가 작업 중이에요<br>잠시만 기다려주세요 (약 10초)</div></div>';
}

async function doSignup(){
  const name=document.getElementById('su-name').value.trim();
  const cls=document.getElementById('su-class').value;
  const id=document.getElementById('su-id').value.trim();
  const pw=document.getElementById('su-pw').value.trim();
  const err=document.getElementById('su-error');
  if(!name||!cls||!id||!pw){err.textContent='모든 항목 입력!';err.style.display='block';return;}
  if(pw.length<4){err.textContent='비밀번호 4자리 이상';err.style.display='block';return;}
  if(id==='teacher'){err.textContent='사용 불가';err.style.display='block';return;}
  const btn=document.querySelector('#screen-signup button[onclick="doSignup()"]');
  btn.textContent='가입 중...';btn.disabled=true;
  try{
    const json=await callAPI({action:'addStudent',class:cls,student_id:id,password:pw,student_name:name});
    if(json.ok){window._student={id:id,name:name,class:cls};document.getElementById('main-name').textContent=name+' 학생';goTo('main');loadChapters(cls);}
    else{err.textContent=json.message||'실패';err.style.display='block';}
  } catch(e){err.textContent='네트워크 오류';err.style.display='block';}
  finally{btn.textContent='가입하기';btn.disabled=false;}
}

function doTeacherLogin(){
  const id=document.getElementById('t-id').value.trim();
  const pw=document.getElementById('t-pw').value.trim();
  const err=document.getElementById('t-error');
  if(id==='teacher'&&pw==='admin1234'){err.style.display='none';window._student={id:'teacher',name:'선생님',class:'teacher'};goTo('teacher-main');}
  else{err.style.display='block';}
}

async function doLogin(){
  const id=document.getElementById('inp-id').value.trim();
  const pw=document.getElementById('inp-pw').value.trim();
  const err=document.getElementById('login-error');
  if(!id||!pw){err.style.display='block';return;}
  const btn=document.querySelector('.login-btn');
  btn.textContent='로그인 중...';btn.disabled=true;err.style.display='none';
  try{
    const json=await callAPI({action:'login',id:id,password:pw});
    if(json.ok){window._student={id:json.id,name:json.name,class:json.class};document.getElementById('main-name').textContent=json.name+' 학생';goTo('main');loadChapters(json.class);}
    else{err.style.display='block';}
  } catch(e){err.style.display='block';}
  finally{btn.textContent='로그인';btn.disabled=false;}
}

async function loadChapters(cls){
  var chList=document.getElementById('ch-list');
  chList.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);">불러오는 중...</div>';
  try{
    var json=await callAPI({action:'getUnits',class:cls,book:'천일문 Grammar 3'});
    if(!json.ok||!json.data.length){chList.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted);">열린 Chapter가 없습니다.<br>선생님께 문의하세요.</div>';return;}
    chList.innerHTML='';
    json.data.forEach(function(ch){
      var card=document.createElement('div');card.className='ch-card';
      var head='<div class="ch-head"><div class="ch-num">'+String(ch.chapter_num).padStart(2,'0')+'</div><div class="ch-info"><h3>'+ch.chapter_name+'</h3><p>Unit '+ch.units.map(u=>u.unit_num).join(', ')+'</p></div></div>';
      var ul='<div class="unit-list">';
      ch.units.forEach(function(u){
        ul+='<div class="unit-row"><div class="udot"></div><div class="uinfo"><div class="unum">Unit '+u.unit_num+'</div><div class="uname">'+u.unit_name+'</div></div><div class="unit-btns">';
        ul+='<button class="unit-btn" onclick="selectUnit('+ch.chapter_num+',\''+ch.chapter_name+'\','+u.unit_num+',\''+u.unit_name+'\',\'summary\')">내용</button>';
        ul+='<button class="unit-btn" onclick="selectUnit('+ch.chapter_num+',\''+ch.chapter_name+'\','+u.unit_num+',\''+u.unit_name+'\',\'blanks\')">빈칸</button>';
        ul+='<button class="unit-btn" onclick="selectUnit('+ch.chapter_num+',\''+ch.chapter_name+'\','+u.unit_num+',\''+u.unit_name+'\',\'quiz\')">문제</button>';
        ul+='</div></div>';
      });
      ul+='</div>';
      card.innerHTML=head+ul;
      chList.appendChild(card);
    });
  } catch(err){chList.innerHTML='<div style="text-align:center;padding:40px;color:var(--red);">불러오기 실패</div>';}
}

function selectUnit(chNum,chName,uNum,uName,screen){
  window._unit={chapter_num:chNum,chapter_name:chName,unit_num:uNum,unit_name:uName};
  if(screen==='blanks'){window._blankWrong=[];window._blankOk=0;window._tryCount={};}
  if(screen==='quiz'){window._quizWrong=[];window._quizTry={};window._quizOk=0;}
  const sub='Ch.'+String(chNum).padStart(2,'0')+' Unit '+uNum+' · '+uName;
  document.querySelectorAll('.top-sub').forEach(el=>el.textContent=sub);
  goTo(screen);
  if(screen==='summary') loadSummary(chNum,uNum);
  if(screen==='blanks') loadBlanks(chNum,uNum);
  if(screen==='quiz') loadQuiz(chNum,uNum,'easy');
}

async function loadSummary(chNum,uNum){
  var area=document.getElementById('summary-content');
  area.innerHTML=makeLoader('#2c6fb5','문법 내용을 정리하고 있어요...');
  try{
    var json=await callAPI({action:'generateContent',type:'summary',chapter:chNum,unit:uNum,chapter_name:window._unit.chapter_name,unit_name:window._unit.unit_name});
    if(!json.ok||!json.data||json.data.error){area.innerHTML='<div style="padding:20px;color:var(--red);">불러오기 실패</div>';return;}
    var points=json.data.points||[];
    var html='<div style="padding-top:8px;">';
    points.forEach(function(pt){
      var tagStyle='background:var(--dark);color:#fff;';
      html+='<div class="pt-card"><div class="pt-head"><div class="pt-tag" style="'+tagStyle+'">'+pt.tag+'</div><strong>'+pt.title+'</strong></div><div class="pt-body">';
      if(pt.formula) html+='<div class="formula">'+pt.formula+'</div>';
      if(pt.rule) html+='<div class="key-rule">'+pt.rule+'</div>';
      if(pt.adverbs&&pt.adverbs.length){html+='<div class="adv-grid">';pt.adverbs.forEach(a=>{html+='<div class="adv-item"><div class="adv-en">'+a.en+'</div><div class="adv-kr">'+a.kr+'</div></div>';});html+='</div>';}
      if(pt.examples&&pt.examples.length){pt.examples.forEach(ex=>{html+='<div class="ex-item"><div class="ex-en">'+ex.en+'</div><div class="ex-kr">'+ex.kr+'</div></div>';});}
      if(pt.caution) html+='<div class="caution"><strong>주의 </strong>'+pt.caution+'</div>';
      html+='</div></div>';
    });
    html+='<button class="btn btn-blue" onclick="goToBlanks()">빈칸 채우기 시작</button><div class="spacer"></div></div>';
    area.innerHTML=html;
  } catch(err){area.innerHTML='<div style="padding:20px;color:var(--red);">오류</div>';}
}

function goToBlanks(){var u=window._unit;if(u) selectUnit(u.chapter_num,u.chapter_name,u.unit_num,u.unit_name,'blanks');}
function goToQuiz(){var u=window._unit;if(u) selectUnit(u.chapter_num,u.chapter_name,u.unit_num,u.unit_name,'quiz');}

let timerInt,secs=900;

async function loadBlanks(chNum,uNum){
  var area=document.getElementById('blanks-content');
  area.innerHTML=makeLoader('#f5a623','빈칸 문제를 만들고 있어요...');
  clearInterval(timerInt);secs=900;window._blankOk=0;window._tryCount={};window._blankWrong=[];
  try{
    var json=await callAPI({action:'generateContent',type:'blanks',chapter:chNum,unit:uNum,chapter_name:window._unit.chapter_name,unit_name:window._unit.unit_name});
    if(!json.ok||!json.data||json.data.error){area.innerHTML='<div style="padding:20px;color:var(--red);">실패</div>';return;}
    var qs=json.data.questions||[];
    window._answers=qs.map(q=>q.answer);
    window._blankQs=qs;
    timerInt=setInterval(function(){secs--;var m=Math.floor(secs/60),s=secs%60;var el=document.getElementById('btimer');if(el) el.textContent=m+':'+(s<10?'0':'')+s;if(secs<=0){clearInterval(timerInt);}},1000);
    var html='<div style="padding-top:8px;">';
    html+='<div class="quiz-meta"><span class="q-count" id="bcount">1 / '+qs.length+'</span><span class="q-timer" id="btimer">15:00</span></div>';
    qs.forEach(function(q,i){
      var d=i===0?'block':'none';
      html+='<div id="bq'+(i+1)+'" class="blank-card" style="display:'+d+';">';
      html+='<div class="blank-num">Q'+(i+1)+' · '+q.point+'</div>';
      html+='<div class="blank-hint">'+q.hint+'</div>';
      // 빈칸 1개만 (첫번째 ___만 input으로)
      var sent=q.sentence.replace('___','<input class="blank-input" id="bi'+(i+1)+'" placeholder="?">');
      html+='<div class="blank-sent">'+sent+'</div>';
      html+='<div class="blank-tr">'+q.translation+'</div>';
      html+='<button class="check-btn" onclick="chkBlank('+(i+1)+','+qs.length+')">확인</button>';
      html+='<div class="fb" id="bf'+(i+1)+'"></div></div>';
    });
    html+='<div id="blank-done" style="display:none;text-align:center;padding:28px 0;"><div style="font-size:48px;margin-bottom:12px;">✅</div><h3>빈칸 완료!</h3><p id="blank-result" style="color:var(--muted);margin:8px 0 22px;"></p><button class="btn btn-blue" onclick="finishBlanks()">문제 풀기 시작</button></div>';
    html+='<div class="spacer"></div></div>';
    area.innerHTML=html;
    document.getElementById('bprog').style.width=(1/qs.length*100)+'%';
  } catch(err){area.innerHTML='<div style="padding:20px;color:var(--red);">오류</div>';}
}

function chkBlank(n,total){
  var inp=document.getElementById('bi'+n);
  var fb=document.getElementById('bf'+n);
  var ans=window._answers[n-1]||'';
  var v=inp.value.trim().toLowerCase();
  var a=String(ans).trim().toLowerCase();
  if(v===a){
    inp.className='blank-input ok';
    fb.className='fb ok';fb.style.display='block';fb.textContent='✅ 정답!';
    window._blankOk++;
    setTimeout(function(){moveBlank(n,total);},1200);
  } else {
    if(!window._tryCount[n]) window._tryCount[n]=0;
    window._tryCount[n]++;
    inp.className='blank-input ng';
    if(window._tryCount[n]<3){
      fb.className='fb ng';fb.style.display='block';
      fb.textContent='❌ 오답입니다. 다시 풀어보세요.';
    } else {
      var q=window._blankQs[n-1];
      window._blankWrong.push({num:n,sentence:q.sentence,answer:ans});
      fb.className='fb ng';fb.style.display='block';
      fb.innerHTML='❌ 정답: <strong>'+ans+'</strong>';
      setTimeout(function(){moveBlank(n,total);},2000);
    }
  }
}

function moveBlank(n,total){
  var next=n+1;
  if(next<=total){
    document.getElementById('bq'+next).style.display='block';
    document.getElementById('bq'+n).style.display='none';
    document.getElementById('bprog').style.width=(next/total*100)+'%';
    document.getElementById('bcount').textContent=next+' / '+total;
  } else {
    clearInterval(timerInt);
    document.getElementById('bq'+n).style.display='none';
    document.getElementById('blank-done').style.display='block';
    document.getElementById('blank-result').textContent=total+'문제 중 '+window._blankOk+'개 정답!';
  }
}

async function finishBlanks(){
  await saveBlankResult();
  goToQuiz();
}

async function saveBlankResult(){
  var u=window._unit;var s=window._student;
  if(!u||!s) return;
  var wrongNote=(window._blankWrong||[]).map(w=>'Q'+w.num+': '+w.sentence+' [정답:'+w.answer+']').join(' / ');
  try{
    await callAPI({action:'saveBlankResult',class:s.class,student_name:s.name,chapter_num:u.chapter_num,unit_num:u.unit_num,blank_score:window._blankOk+'/'+window._blankQs.length,wrong_note:wrongNote});
  }catch(e){}
}

async function loadQuiz(chNum,uNum,diff){
  var area=document.getElementById('quiz-content');
  area.innerHTML=makeLoader('#e74c3c','문제를 만들고 있어요...');
  window._quizTry={};window._quizWrong=[];
  var labels={'easy':'쉬움','medium':'보통','hard':'도전'};
  try{
    var json=await callAPI({action:'generateContent',type:'quiz',chapter:chNum,unit:uNum,diff:diff,chapter_name:window._unit.chapter_name,unit_name:window._unit.unit_name});
    if(!json.ok||!json.data||json.data.error){area.innerHTML='<div style="padding:20px;color:var(--red);">실패</div>';return;}
    var qs=json.data.questions||[];
    window._quizQs=qs;
    var html='<div style="padding-top:8px;">';
    html+='<div class="diff-tabs">';
    ['easy','medium','hard'].forEach(function(d){
      var icons={'easy':'🟢','medium':'🟡','hard':'🔴'};
      var on=d===diff?' '+(d==='easy'?'e-on':d==='medium'?'m-on':'h-on'):'';
      html+='<div class="diff-tab'+on+'" onclick="changeDiff(\''+d+'\')"><div class="di">'+icons[d]+'</div><div class="dl">'+labels[d]+'</div></div>';
    });
    html+='</div>';
    html+='<div class="q-info-bar">'+labels[diff]+' 난이도 · '+qs.length+'문제</div>';
    qs.forEach(function(q){
      html+='<div class="q-card"><div class="q-badge">'+q.type+'</div>';
      html+='<div class="q-text">'+q.num+'. '+q.question+'</div>';
      if(q.options&&q.options.length){
        html+='<div class="opts" id="qg'+q.num+'">';
        q.options.forEach(function(opt,i){
          var isCorrect=(i+1)===q.answer;
          // 동그라미 숫자 ①②③④⑤⑥⑦⑧⑨⑩ 제거 (강력)
          var cleanOpt=String(opt).replace(/[\u2460-\u2473\u24EB-\u24FF\u2776-\u277F]\s*/g,'').replace(/^\([0-9]+\)\s*/,'').replace(/^[0-9]+[\.\)]\s*/,'').trim();
          html+='<div class="opt" data-correct="'+isCorrect+'" data-opttext="'+cleanOpt.replace(/"/g,'&quot;')+'" onclick="poClick(this,\'qg'+q.num+'\')">';
          html+='<div class="opt-n">'+(i+1)+'</div>'+cleanOpt+'</div>';
        });
        html+='</div>';
      }
      html+='<div class="fb" id="fb-qg'+q.num+'"></div></div>';
    });
    html+='<div id="next-diff-area" style="display:none;margin-top:10px;"><button class="btn btn-blue" id="next-diff-btn" onclick="goNextDiff()">다음 단계로 →</button></div>';
    html+='<div class="spacer"></div></div>';
    area.innerHTML=html;
    window._currentDiff=diff;
  } catch(err){area.innerHTML='<div style="padding:20px;color:var(--red);">오류</div>';}
}

function changeDiff(d){var u=window._unit;if(u) loadQuiz(u.chapter_num,u.unit_num,d);}

function poClick(el,gid){
  var grp=document.getElementById(gid);
  var fb=document.getElementById('fb-'+gid);
  if(grp.classList.contains('done')) return;
  
  var isCorrect=el.getAttribute('data-correct')==='true';
  if(!window._quizTry[gid]) window._quizTry[gid]=0;
  window._quizTry[gid]++;
  
  // 이전 선택 표시 제거 (수정 가능하게)
  grp.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));
  
  if(isCorrect){
    el.classList.add('right');
    grp.classList.add('done');
    fb.className='fb ok';fb.style.display='block';fb.textContent='✅ 정답!';
    setTimeout(checkQuizDone,300);
    return;
  }
  
  el.classList.add('wrong');
  if(window._quizTry[gid]<3){
    fb.className='fb ng';fb.style.display='block';
    fb.textContent='❌ 오답입니다. 다시 풀어보세요.';
  } else {
    grp.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-correct')==='true') o.classList.add('right');});
    var correctOpt=grp.querySelector('.opt.right');
    var correctText=correctOpt?correctOpt.getAttribute('data-opttext'):'';
    var qText=grp.parentElement.querySelector('.q-text').textContent.trim();
    window._quizWrong.push({question:qText,answer:correctText,diff:window._currentDiff});
    grp.classList.add('done');
    fb.className='fb ng';fb.style.display='block';
    fb.innerHTML='❌ 정답: <strong>'+correctText+'</strong>';
    setTimeout(checkQuizDone,300);
  }
}

function checkQuizDone(){
  var area=document.getElementById('quiz-content');
  if(!area) return;
  var allOpts=area.querySelectorAll('.opts');
  var doneCount=0;
  var correctCount=0;
  allOpts.forEach(function(o){
    if(o.classList.contains('done')){
      doneCount++;
      if(o.querySelector('.opt.right')&&!o.querySelector('.opt.wrong')) correctCount++;
    }
  });
  window._quizOk=correctCount;
  if(doneCount>=allOpts.length&&allOpts.length>0){
    var nextArea=document.getElementById('next-diff-area');
    var nextBtn=document.getElementById('next-diff-btn');
    if(!nextArea) return;
    nextArea.style.display='block';
    var diff=window._currentDiff||'easy';
    var labels={'easy':'보통 단계로','medium':'도전 단계로','hard':'완료'};
    nextBtn.textContent=labels[diff]+' ('+correctCount+'/'+allOpts.length+'개)';
    nextArea.scrollIntoView({behavior:'smooth'});
  }
}

async function goNextDiff(){
  await saveQuizResult();
  var diff=window._currentDiff||'easy';
  if(diff==='easy'){loadQuiz(window._unit.chapter_num,window._unit.unit_num,'medium');}
  else if(diff==='medium'){loadQuiz(window._unit.chapter_num,window._unit.unit_num,'hard');}
  else {alert('모든 단계 완료! 수고했어요 🎉');goTo('main');}
  window.scrollTo(0,0);
}

async function saveQuizResult(){
  var u=window._unit;var s=window._student;
  if(!u||!s) return;
  var wrongNote=(window._quizWrong||[]).map(w=>'['+w.diff+']'+w.question+' [정답:'+w.answer+']').join(' / ');
  try{
    await callAPI({action:'saveQuizResult',class:s.class,student_name:s.name,chapter_num:u.chapter_num,unit_num:u.unit_num,diff:window._currentDiff,quiz_score:window._quizOk||0,wrong_note:wrongNote});
  }catch(e){}
}

let tcCurrentClass='5a',tcCurrentBook='천일문 Grammar 3',tcChState={};

function tcSelectClass(cls,btn){tcCurrentClass=cls;document.querySelectorAll('.tc-class-btn').forEach(b=>b.classList.remove('tc-on'));btn.classList.add('tc-on');tcRenderChapters();}
function tcSelectBook(book,btn){tcCurrentBook=book;document.querySelectorAll('.tc-book-btn').forEach(b=>b.classList.remove('tc-book-on'));btn.classList.add('tc-book-on');tcRenderChapters();}

function tcRenderChapters(){
  const chapters=BOOKS[tcCurrentBook]||[];
  const list=document.getElementById('tc-ch-list');
  if(!list) return;
  chapters.forEach(ch=>{if(tcChState[tcCurrentClass+'_'+tcCurrentBook+'_'+ch.num]===undefined) tcChState[tcCurrentClass+'_'+tcCurrentBook+'_'+ch.num]=false;});
  list.innerHTML=chapters.map((ch,i)=>{
    const key=tcCurrentClass+'_'+tcCurrentBook+'_'+ch.num;
    const open=tcChState[key]||false;
    const last=i===chapters.length-1;
    return '<div onclick="tcToggle(\''+ch.num+'\')" style="display:flex;align-items:center;padding:14px 18px;'+(last?'':'border-bottom:1.5px solid #e0ecf8;')+'cursor:pointer;background:'+(open?'#eafaf1':'#fff')+';"><div style="width:36px;height:36px;background:'+(open?'#27ae60':'#8a9ab0')+';color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:12px;">'+ch.num+'</div><div style="flex:1;"><div style="font-size:15px;font-weight:700;color:'+(open?'#1a3a5c':'#8a9ab0')+';">'+ch.name+'</div><div style="font-size:12px;color:#8a9ab0;margin-top:2px;">'+ch.units+'</div></div><div style="font-size:13px;font-weight:700;color:'+(open?'#27ae60':'#c8dff5')+';">'+(open?'열림':'닫힘')+'</div></div>';
  }).join('');
}

function tcToggle(num){const key=tcCurrentClass+'_'+tcCurrentBook+'_'+num;tcChState[key]=!tcChState[key];tcRenderChapters();}
function tcSelectAll(open){const chapters=BOOKS[tcCurrentBook]||[];chapters.forEach(ch=>{tcChState[tcCurrentClass+'_'+tcCurrentBook+'_'+ch.num]=open;});tcRenderChapters();}

async function tcSave(){
  const chapters=BOOKS[tcCurrentBook]||[];
  if(!chapters.length){alert('교재 선택!');return;}
  const btn=document.querySelector('#screen-teacher-chapters button[onclick="tcSave()"]');
  if(btn){btn.textContent='저장 중...';btn.disabled=true;}
  let fail=0;
  for(const ch of chapters){
    const key=tcCurrentClass+'_'+tcCurrentBook+'_'+ch.num;
    const open=tcChState[key]?'TRUE':'FALSE';
    try{await callAPI({action:'saveOpen',class:tcCurrentClass,book:tcCurrentBook,chapter:ch.num,chapter_name:ch.name,open:open});}
    catch(e){fail++;}
  }
  if(btn){btn.textContent='저장';btn.disabled=false;}
  alert(fail===0?'저장 완료!':'일부 실패 ('+fail+'개)');
}

function enterTeacherChapters(){goTo('teacher-chapters');setTimeout(tcRenderChapters,100);}

async function addStudent(){
  const cls=document.getElementById('s-class').value.trim();
  const id=document.getElementById('s-id').value.trim();
  const pw=document.getElementById('s-pw').value.trim();
  const name=document.getElementById('s-name').value.trim();
  if(!cls||!id||!pw||!name){alert('모두 입력!');return;}
  try{
    const json=await callAPI({action:'addStudent',class:cls,student_id:id,password:pw,student_name:name});
    if(json.ok){alert('추가 완료!');document.getElementById('s-class').value='';document.getElementById('s-id').value='';document.getElementById('s-pw').value='';document.getElementById('s-name').value='';}
    else alert('오류: '+json.message);
  } catch(e){alert('네트워크 오류');}
}

async function loadResults(cls,btn){
  document.querySelectorAll('.tr-cls-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  const area=document.getElementById('results-area');
  area.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);">불러오는 중...</div>';
  try{
    const json=await callAPI({action:'getResults',class:cls});
    if(!json.ok||!json.data.length){area.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);">결과 없음</div>';return;}
    let html='';
    json.data.forEach(r=>{
      html+='<div style="background:#fff;border:2px solid #c8dff5;border-radius:14px;padding:14px 18px;margin-bottom:10px;font-size:14px;color:#3a5a7a;line-height:1.8;"><strong style="color:#1a3a5c;">'+r.student_name+'</strong> · Ch.'+r.chapter_num+' Unit '+r.unit_num+'<br>빈칸 <strong>'+(r.blank_score||'-')+'</strong> / 문제 <strong>'+(r.quiz_score||'-')+'</strong>';
      if(r.note_link) html+='<br><span style="color:#e74c3c;font-size:12px;">📝 '+r.note_link+'</span>';
      html+='</div>';
    });
    area.innerHTML=html;
  } catch(e){area.innerHTML='<div style="text-align:center;padding:20px;color:var(--red);">실패</div>';}
}
